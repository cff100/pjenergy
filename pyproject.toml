
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pjenergy"
version = "0.1.3"
description = "Projeto de análise energética"
authors = [{ name = "Caio Felix" }]
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest]
addopts = ["-ra", "--cov=src", "--cov-report=term-missing", "--cov-report=html"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]